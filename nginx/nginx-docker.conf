worker_processes 2;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # 连接复用
    keepalive_timeout 65;
    keepalive_requests 1000;

    # 关闭不必要的缓冲
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 代理缓冲
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # HTTP/1.1 keepalive 到上游
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 上游 keepalive 连接池
    upstream order_api {
        server order-api-1:8894;
        server order-api-2:8895;
        server order-api-3:8896;
        keepalive 64;
    }

    upstream user_api {
        server user-api:8888;
        keepalive 64;
    }

    server {
        listen 80;

        location /api/user/ {
            set $user_backend user_api;
            proxy_pass http://$user_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /admin/ {
            set $admin_backend admin-api:8889;
            proxy_pass http://$admin_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /event/ {
            set $event_backend event-api:8890;
            proxy_pass http://$event_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /show/ {
            set $event_backend event-api:8890;
            proxy_pass http://$event_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ticket-type/ {
            set $event_backend event-api:8890;
            proxy_pass http://$event_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/inventory/ {
            set $inv_backend inventory-api:8891;
            proxy_pass http://$inv_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/admin/inventory/ {
            set $inv_backend inventory-api:8891;
            proxy_pass http://$inv_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/order/ {
            set $order_backend order_api;
            proxy_pass http://$order_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 票务服务
        location /api/ticket/ {
            set $ticket_backend ticket-api:8892;
            proxy_pass http://$ticket_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 管理端订单（改/删）
        location /api/v1/admin/order/ {
            set $order_backend order_api;
            proxy_pass http://$order_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 前端 SPA 静态资源
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
